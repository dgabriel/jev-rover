[project]
name = "jev-rover"
version = "0.1.0"
description = "A tiny autonomous rover whose state machine is replaced by Jev, a typed decision model"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevrover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
